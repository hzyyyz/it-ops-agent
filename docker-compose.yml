services:
  app:
    build: .
    container_name: it-ops-agent
    ports:
      - "8501:8501"
    environment:
      - AGENT_API_URL=http://api:8000
      - AGENT_ADMIN_TOKEN=${AGENT_ADMIN_TOKEN:?Set AGENT_ADMIN_TOKEN in .env}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      api-init:
        condition: service_completed_successfully
      mcp:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./logs:/app/logs
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
      - type: bind
        source: ${HF_CACHE_HOST_PATH:-./hf_cache}
        target: /root/.cache/huggingface
        read_only: true
    environment:
      - CHAT_MODEL_NAME=${CHAT_MODEL_NAME:-deepseek-v4-flash}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.deepseek.com}
      # 按 OPENAI_BASE_URL 选中的那一个生效，未设置的留空即可
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-small-zh-v1.5}
      - RAG_RETRIEVAL_MODE=${RAG_RETRIEVAL_MODE:-advanced}
      - RAG_RERANKER_MODEL=${RAG_RERANKER_MODEL:-BAAI/bge-reranker-base}
      - AGENT_TRACE_FILE=${AGENT_TRACE_FILE:-/app/logs/traces.jsonl}
      - AGENT_ADMIN_TOKEN=${AGENT_ADMIN_TOKEN:?Set AGENT_ADMIN_TOKEN in .env}
      - HF_HUB_OFFLINE=1
      - MCP_SERVER_URL=http://mcp:8001/mcp
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-it_ops_agent}
      - MYSQL_USER=${MYSQL_USER:-it_ops_agent}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped

  mcp:
    build: .
    command: ["python", "-m", "mcp_tools.server"]
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8001
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8001),timeout=5); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  api-init:
    build: .
    command: ["python", "-m", "backend.init_db"]
    volumes:
      - ./data:/app/data
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-it_ops_agent}
      - MYSQL_USER=${MYSQL_USER:-it_ops_agent}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    restart: "no"

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-it_ops_agent}
      - MYSQL_USER=${MYSQL_USER:-it_ops_agent}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  mysql_data:
